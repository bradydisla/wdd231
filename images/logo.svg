<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="logoTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="logoTitle">BDM Logo</title>

  <!-- Background rounded square -->
  <rect x="2" y="2" width="96" height="96" rx="18" fill="#0f4c5c"/>

  <!-- Code bracket left -->
  <text x="14" y="66" font-family="'Courier New', monospace" font-size="34" font-weight="700" fill="#e36414">&lt;</text>

  <!-- Initials BDM -->
  <text x="50" y="62" font-family="'Poppins', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">BDM</text>

  <!-- Code bracket right -->
  <text x="86" y="66" font-family="'Courier New', monospace" font-size="34" font-weight="700" fill="#e36414" text-anchor="end">&gt;</text>

  <!-- Blinking cursor accent -->
  <rect x="20" y="76" width="60" height="4" rx="2" fill="#9bc53d"/>
</svg>
