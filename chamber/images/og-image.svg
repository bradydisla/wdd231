<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121d33" />
      <stop offset="100%" stop-color="#1b2a4a" />
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- decorative gold accent bar -->
  <rect x="0" y="0" width="1200" height="10" fill="#c08a28" />
  <rect x="0" y="620" width="1200" height="10" fill="#c08a28" />

  <!-- decorative circle motif -->
  <circle cx="1040" cy="120" r="180" fill="#c08a28" opacity="0.08" />
  <circle cx="120" cy="540" r="140" fill="#c08a28" opacity="0.08" />

  <!-- chamber icon (simple building / column motif) -->
  <g transform="translate(150, 210)">
    <rect x="0" y="90" width="140" height="14" rx="3" fill="#e0b563" />
    <polygon points="70,0 140,50 0,50" fill="#e0b563" />
    <rect x="14" y="50" width="18" height="40" fill="#f0ead9" />
    <rect x="46" y="50" width="18" height="40" fill="#f0ead9" />
    <rect x="78" y="50" width="18" height="40" fill="#f0ead9" />
    <rect x="110" y="50" width="18" height="40" fill="#f0ead9" />
  </g>

  <!-- text block -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="150" y="380" font-size="58" font-weight="700" fill="#ffffff">Camara de Comercio</text>
    <text x="150" y="430" font-size="30" fill="#e0b563">Santiago de los Caballeros</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="150" y="490" font-size="22" fill="#e4dcc4">Member Directory &amp; Business Resources</text>
  </g>
</svg>
