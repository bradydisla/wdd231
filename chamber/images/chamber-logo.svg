<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- outer ring -->
  <circle cx="60" cy="60" r="58" fill="#1B2A4A"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#C08A28" stroke-width="2"/>

  <!-- monument (Monumento a los Heroes de la Restauracion, Santiago) -->
  <polygon points="60,28 74,90 46,90" fill="#F0EAD9"/>
  <polygon points="60,28 67,90 60,90" fill="#D9D0B8"/>

  <!-- base steps -->
  <rect x="40" y="90" width="40" height="6" fill="#C08A28"/>
  <rect x="34" y="96" width="52" height="5" fill="#E0B563"/>

  <!-- torch flame -->
  <path d="M60 16 C63.5 20 63.5 25 60 28 C56.5 25 56.5 20 60 16 Z" fill="#C08A28"/>

  <!-- inner hairline -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#C08A28" stroke-width="0.75" opacity="0.4"/>
</svg>
